AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HawkerFlow - hawker centre food ordering platform.
  Serverless, pay-per-request stack: CloudFront+S3, Cognito (Lite tier), API Gateway
  (HTTP API), Lambda (Python 3.12, X-Ray), DynamoDB single table + Streams,
  SQS + DLQs, 14-day log retention, CloudWatch alarms, SSM config.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev

Mappings:
  # Reserved concurrency is drawn from a SINGLE account-wide pool (default 1000, of which
  # at least 100 must stay unreserved). dev + prod live in one account, so the two stacks
  # must fit together: 150 (dev) + 600 (prod) = 750 reserved, 250 unreserved.
  # MaximumConcurrency on an SQS event source must be <= that function's reserved concurrency.
  StageConfig:
    dev:
      MerchantConcurrency: 10
      CatalogConcurrency: 40
      OrderingConcurrency: 50
      DispatcherConcurrency: 20
      NotificationConcurrency: 20
      AnalyticsConcurrency: 10
      NotificationMaxConcurrency: 10
      AnalyticsMaxConcurrency: 5
    prod:
      MerchantConcurrency: 40
      CatalogConcurrency: 150
      OrderingConcurrency: 200
      DispatcherConcurrency: 80
      NotificationConcurrency: 80
      AnalyticsConcurrency: 50
      NotificationMaxConcurrency: 60
      AnalyticsMaxConcurrency: 40

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Layers:
      - !Ref SharedLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref PlatformTable
        STAGE: !Ref Stage
        NOTIF_QUEUE_URL: !Ref NotificationsQueue
        ANALYTICS_QUEUE_URL: !Ref AnalyticsQueue
        ORDER_TTL_PARAM: !Sub /hawkerflow/${Stage}/order-ttl-days
  HttpApi:
    CorsConfiguration:
      AllowOrigins: ['*']
      AllowHeaders: ['*']
      AllowMethods: ['*']

Resources:

  # ---------------- Data ----------------
  PlatformTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete            # practice project - teardown must be clean
    UpdateReplacePolicy: Retain       # but never silently lose order data on a replacing update
    Properties:
      TableName: !Sub hawkerflow-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: GSI1PK, KeyType: HASH}
            - {AttributeName: GSI1SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: GSI2
          KeySchema:
            - {AttributeName: GSI2PK, KeyType: HASH}
            - {AttributeName: GSI2SK, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------- Configuration (SSM Parameter Store) ----------------
  OrderTtlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /hawkerflow/${Stage}/order-ttl-days
      Type: String
      Value: '90'
      Description: Online retention of order records in days (read by the ordering services)

  # ---------------- Events ----------------
  NotificationsDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-notifications-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-notifications
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600     # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDLQ.Arn
        maxReceiveCount: 3
  AnalyticsDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-analytics-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  AnalyticsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub hawkerflow-${Stage}-analytics
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600     # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyticsDLQ.Arn
        maxReceiveCount: 3

  # ---------------- Identity ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Delete            # practice project - clean teardown
    UpdateReplacePolicy: Retain       # user accounts survive a replacing update
    Properties:
      UserPoolName: !Sub hawkerflow-${Stage}
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub hawkerflow-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
  StallOwnerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: stall-owner
      UserPoolId: !Ref UserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  # ---------------- API ----------------
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoJwt

  # ---------------- Shared layer ----------------
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub hawkerflow-${Stage}-shared
      ContentUri: ../services/shared
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  # ---------------- Services ----------------
  # IAM: each function gets only the DynamoDB actions and resources it uses
  # (no Scan or DeleteItem anywhere; dispatcher has no table access at all).
  MerchantFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-merchant
      # Bulkhead: low-volume onboarding
      ReservedConcurrentExecutions: !FindInMap [StageConfig, !Ref Stage, MerchantConcurrency]
      CodeUri: ../services/merchant/src
      Handler: merchant_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt PlatformTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt PlatformTable.Arn
                - !Sub ${PlatformTable.Arn}/index/GSI2
      Events:
        CreateStall:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/stalls
        MyStalls:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/me/stalls
        UpdateStall:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/stalls/{stallId}

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-catalog
      # Bulkhead: read-heavy browsing - capped so a browse spike cannot starve the write path
      ReservedConcurrentExecutions: !FindInMap [StageConfig, !Ref Stage, CatalogConcurrency]
      CodeUri: ../services/catalog/src
      Handler: catalog_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt PlatformTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt PlatformTable.Arn
                - !Sub ${PlatformTable.Arn}/index/GSI1
      Events:
        ListStalls:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/centres/{centreId}/stalls
            Auth: {Authorizer: NONE}
        GetStall:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}
            Auth: {Authorizer: NONE}
        GetMenu:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}/menu
            Auth: {Authorizer: NONE}
        PutMenuItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PUT
            Path: /v1/stalls/{stallId}/menu/{itemId}

  OrderingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-ordering
      # Bulkhead: protected floor for the revenue-critical write path
      ReservedConcurrentExecutions: !FindInMap [StageConfig, !Ref Stage, OrderingConcurrency]
      CodeUri: ../services/ordering/src
      Handler: ordering_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt PlatformTable.Arn
            - Effect: Allow
              Action: [dynamodb:Query]
              Resource:
                - !GetAtt PlatformTable.Arn
                - !Sub ${PlatformTable.Arn}/index/GSI1
                - !Sub ${PlatformTable.Arn}/index/GSI2
        - SSMParameterReadPolicy:
            ParameterName: !Sub hawkerflow/${Stage}/order-ttl-days
      Events:
        PlaceOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/orders
        GetOrder:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/orders/{orderId}
        MyOrders:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/me/orders
        StallQueue:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}/orders
        Transition:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/orders/{orderId}

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-dispatcher
      # Bulkhead: outbox must never be starved - events would lag
      ReservedConcurrentExecutions: !FindInMap [StageConfig, !Ref Stage, DispatcherConcurrency]
      CodeUri: ../services/dispatcher/src
      Handler: dispatcher_service.handler.lambda_handler
      Policies:
        - SQSSendMessagePolicy: {QueueName: !GetAtt NotificationsQueue.QueueName}
        - SQSSendMessagePolicy: {QueueName: !GetAtt AnalyticsQueue.QueueName}
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PlatformTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumBatchingWindowInSeconds: 1
            # Shards are processed serially by default; fan out across partition keys
            ParallelizationFactor: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-notification
      # Bulkhead: async consumer
      ReservedConcurrentExecutions: !FindInMap [StageConfig, !Ref Stage, NotificationConcurrency]
      CodeUri: ../services/notification/src
      Handler: notification_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt PlatformTable.Arn
        - SQSPollerPolicy: {QueueName: !GetAtt NotificationsQueue.QueueName}
      Events:
        Messages:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationsQueue.Arn
            BatchSize: 10
            ScalingConfig:
              MaximumConcurrency: !FindInMap [StageConfig, !Ref Stage, NotificationMaxConcurrency]
        MyNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/me/notifications

  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hawkerflow-${Stage}-analytics
      # Bulkhead: async consumer, tolerant of delay
      ReservedConcurrentExecutions: !FindInMap [StageConfig, !Ref Stage, AnalyticsConcurrency]
      CodeUri: ../services/analytics/src
      Handler: analytics_service.handler.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
              Resource: !GetAtt PlatformTable.Arn
        - SQSPollerPolicy: {QueueName: !GetAtt AnalyticsQueue.QueueName}
      Events:
        Messages:
          Type: SQS
          Properties:
            Queue: !GetAtt AnalyticsQueue.Arn
            BatchSize: 10
            ScalingConfig:
              MaximumConcurrency: !FindInMap [StageConfig, !Ref Stage, AnalyticsMaxConcurrency]
        StallAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/stalls/{stallId}/analytics

  # ---------------- Observability: 14-day log retention ----------------
  MerchantLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-merchant
      RetentionInDays: 14
  CatalogLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-catalog
      RetentionInDays: 14
  OrderingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-ordering
      RetentionInDays: 14
  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-dispatcher
      RetentionInDays: 14
  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-notification
      RetentionInDays: 14
  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/hawkerflow-${Stage}-analytics
      RetentionInDays: 14

  # ---------------- Observability: alarms (5 per stage, within the 10 free) ----------------
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-api-5xx
      AlarmDescription: Server errors at the API front door
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - {Name: ApiId, Value: !Ref Api}
        - {Name: Stage, Value: !Ref Stage}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  NotificationsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-notifications-dlq
      AlarmDescription: Poison messages parked in the notifications DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt NotificationsDLQ.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AnalyticsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-analytics-dlq
      AlarmDescription: Poison messages parked in the analytics DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt AnalyticsDLQ.QueueName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  OrderingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-ordering-errors
      AlarmDescription: Unhandled errors in the ordering services
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref OrderingFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-dispatcher-errors
      AlarmDescription: Outbox dispatcher failing - events not flowing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref DispatcherFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DispatcherIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-dispatcher-lag
      AlarmDescription: Event pipeline falling behind - leading indicator of write-path saturation
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - {Name: FunctionName, Value: !Ref DispatcherFunction}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 60000          # 60 s behind the stream
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  OrderingThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub hawkerflow-${Stage}-ordering-throttled
      AlarmDescription: Ordering hit its reserved concurrency ceiling - scale the bulkhead
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - {Name: FunctionName, Value: !Ref OrderingFunction}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------- Web hosting ----------------
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub hawkerflow-${Stage}-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub hawkerflow-${Stage}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub HawkerFlow ${Stage} web apps
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: web-bucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: web-bucket
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref PlatformTable
  WebBucketName:
    Value: !Ref WebBucket
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
