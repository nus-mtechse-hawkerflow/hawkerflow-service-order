# HawkerFlow service pipeline (drop-in for order, hawker, customer, analytics)
#
#   PR to main/release ─┐
#   push to main ───────┼─► quality ─┐
#                       │   sast ────┤
#                       │   sca ─────┼─► image (build, Trivy scan, SBOM) ─┐
#                       │   secrets ─┘                                    │
#   push to release ────┴──────────────────────────────────────────────► deploy ─► smoke ─► dast
#
# Every gate runs on every PR. Only a push to `release` pushes an image and deploys,
# and only after all gates pass.
#
# Repository / environment configuration expected:
#   secrets.AWS_ROLE_TO_ASSUME      OIDC role (ECR push + ECS deploy)
#   vars.ECR_REPOSITORY             e.g. hawkerflow-order
#   vars.ECS_CLUSTER, vars.ECS_SERVICE, vars.ECS_TASK_FAMILY, vars.ECS_CONTAINER_NAME
#   vars.API_BASE_URL               API Gateway base URL, e.g. https://abc123.execute-api.ap-southeast-1.amazonaws.com
#   vars.SERVICE_PATH               path prefix routed to this service: /order | /hawker | /customer | /analytics

name: CI/CD

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: ap-southeast-1
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_IMAGE: aquasec/trivy:0.57.0   # bump to the current release when you adopt this
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  # ------------------------------------------------------------------
  # 1. Lint + unit tests
  # ------------------------------------------------------------------
  quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pytest-cov

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Pytest with coverage
        env:
          PYTHONPATH: src
        run: pytest -q --junitxml=reports/junit.xml --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  # ------------------------------------------------------------------
  # 2. SAST: Bandit (Python-specific) + Semgrep (OWASP rules)
  #    Results land in GitHub > Security > Code scanning.
  #    CodeQL runs in its own workflow (codeql.yml).
  # ------------------------------------------------------------------
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install "bandit[sarif]>=1.7" semgrep

      - name: Bandit (report all findings)
        run: bandit -r src -f sarif -o bandit.sarif --exit-zero

      - name: Semgrep (registry packs + HawkerFlow rules, report all findings)
        run: |
          semgrep scan src resources \
            --config p/python --config p/owasp-top-ten --config p/secrets \
            --config .semgrep/ \
            --sarif --output semgrep.sarif --metrics=off

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # Gate: fail on medium+ severity with medium+ confidence (Bandit)
      # and on ERROR-level Semgrep findings.
      - name: Gate on Bandit medium/high
        run: bandit -r src -ll -ii

      - name: Gate on Semgrep registry errors
        run: |
          semgrep scan src \
            --config p/python --config p/owasp-top-ten --config p/secrets \
            --severity ERROR --error --metrics=off

      # The HawkerFlow rules encode known open issues (AISS-06 etc.). They report
      # to Code Scanning from day one; set repo variable ENFORCE_HAWKERFLOW_RULES=true
      # once the fixes are merged, so the issues cannot return.
      - name: Gate on HawkerFlow rules
        if: vars.ENFORCE_HAWKERFLOW_RULES == 'true'
        run: semgrep scan src resources --config .semgrep/ --severity ERROR --error --metrics=off

  # ------------------------------------------------------------------
  # 3. SCA: known-vulnerable dependencies
  # ------------------------------------------------------------------
  sca:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "pip-audit>=2.7"
      - name: pip-audit
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt --format json --output reports/pip-audit.json || true
          pip-audit -r requirements.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: reports/

  # ------------------------------------------------------------------
  # 4. Secrets: full git history, not just the working tree
  # ------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan every commit
        run: gitleaks git . --redact --verbose --report-format sarif --report-path gitleaks.sarif

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ------------------------------------------------------------------
  # 5. Build image, scan it, produce an SBOM; push only on release
  # ------------------------------------------------------------------
  image:
    name: Build, scan & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, sast, sca, secrets]
    permissions:
      contents: read
      security-events: write
    env:
      LOCAL_IMAGE: hawkerflow-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Trivy - Dockerfile misconfiguration
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" config --exit-code 0 --severity MEDIUM,HIGH,CRITICAL /src/Dockerfile

      - name: Trivy - image vulnerabilities (SARIF)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --format sarif --output /out/trivy.sarif "$LOCAL_IMAGE"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json "$LOCAL_IMAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      # Gate: fixable HIGH/CRITICAL CVEs block the release.
      - name: Gate on fixable HIGH/CRITICAL CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_IMAGE"

      # Hand the exact scanned image to the deploy job (release pushes only).
      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: docker save "$LOCAL_IMAGE" | gzip > image.tar.gz

      - if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image
          path: image.tar.gz
          retention-days: 1

  # ------------------------------------------------------------------
  # 6. Push to ECR + deploy to ECS (release branch only), then smoke test
  # ------------------------------------------------------------------
  deploy:
    name: Push & deploy to ECS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    environment: PROD   # NB: currently points at the dev stack (AISS-15)
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ecs-deploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      LOCAL_IMAGE: hawkerflow-service:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-image

      - name: Load scanned image
        run: gunzip -c image.tar.gz | docker load

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: hawkerflow-deploy-${{ github.run_id }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image (tagged by commit SHA)
        id: push
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          docker tag "$LOCAL_IMAGE" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_TASK_FAMILY }}
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image }}

      - name: Deploy and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Smoke test through API Gateway
        run: |
          url="${{ vars.API_BASE_URL }}${{ vars.SERVICE_PATH }}/health"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "attempt $i: $url -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::Smoke test failed: $url did not return 200"
          exit 1

  # ------------------------------------------------------------------
  # 7. DAST: OWASP ZAP API scan against the service just deployed.
  #    Report-only until AISS-06 (auth) is fixed; then set ZAP_FAIL=true.
  # ------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: ZAP API scan from the service's OpenAPI spec
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/rules.tsv && chmod -R 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" zap-api-scan.py \
            -t "${{ vars.API_BASE_URL }}${{ vars.SERVICE_PATH }}/openapi.json" \
            -f openapi -O "${{ vars.API_BASE_URL }}${{ vars.SERVICE_PATH }}" \
            -c rules.tsv \
            -r zap-report.html -J zap-report.json -w zap-report.md \
            || code=$?
          echo "ZAP exit code: ${code:-0} (0 pass, 1 FAIL alerts, 2 WARN only, 3 error)"
          if [ "${{ vars.ZAP_FAIL }}" = "true" ] && [ "${code:-0}" = "1" ]; then exit 1; fi
          if [ "${code:-0}" = "3" ]; then exit 3; fi

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/
