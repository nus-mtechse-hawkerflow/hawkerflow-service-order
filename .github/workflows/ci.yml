name: CI/CD

on:
  push:
    branches:
      - release

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: ap-southeast-1

jobs:

  # ==========================================
  # 1. VALIDATION
  # ==========================================
  validation:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------
      # Python
      # --------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # --------------------------------------
      # Dependencies
      # --------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --------------------------------------
      # Ruff
      # --------------------------------------
      - name: Ruff Linting
        run: ruff check .

      # --------------------------------------
      # Bandit
      # --------------------------------------
      - name: Bandit Security Scan
        run: bandit -r src

      # --------------------------------------
      # Dependency Audit
      # --------------------------------------
      - name: Dependency Vulnerability Scan
        run: pip-audit -r requirements.txt

      # --------------------------------------
      # Unit Tests
      # --------------------------------------
      - name: Run Unit Tests
        env:
          PYTHONPATH: src
        run: pytest -q

      # --------------------------------------
      # Gitleaks
      # --------------------------------------
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan Secrets
        run: gitleaks detect --source . -v --redact


  # ==========================================
  # 2. BUILD & DEPLOY
  # ==========================================
  deploy:
    name: Build & Deploy ECS
    runs-on: ubuntu-latest

    needs:
      - validation

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    environment: PROD

    permissions:
      contents: read
      id-token: write

    timeout-minutes: 30

    concurrency:
      group: hawkerflow-prod-deployment
      cancel-in-progress: false

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------
      # AWS Authentication
      # --------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: hawkerflow-ecr-role

      # --------------------------------------
      # ECR Login
      # --------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------
      # Docker Build & Push
      # --------------------------------------
      - name: Build and Push Docker Image
        id: build-image

        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          IMAGE_URI="$REGISTRY/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"

          echo "Building image: $IMAGE_URI"

          docker build \
            --tag "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # --------------------------------------
      # ECS Task Definition
      # --------------------------------------
      - name: Render ECS Task Definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ vars.ECS_TASK_FAMILY }}
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # --------------------------------------
      # ECS Deployment
      # --------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true